[tool.poetry]
name = "telegram-coinglass-trader"
version = "0.1.0"
description = "Async Crypto Trading Bot Architecture with CoinGlass integration and Telegram control"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "telegram_coinglass_trader", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
asyncio = "^3.4.3"
uvloop = "^0.19.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.2"
httpx = "^0.26.0"
ccxt = "^4.2.0"
aiogram = "^3.4.0"
apscheduler = "^3.10.4"
pandas = "^2.1.4"
pandas-ta = "^0.3.14b0"
numpy = "^1.26.2"
redis = "^5.0.1"
backtesting = "^0.4.0"
yfinance = "^0.2.63"
asyncpg = "^0.29.0"
tenacity = "^8.2.3"
python-dotenv = "^1.0.0"
psutil = "^5.9.0"
websockets = "^13.0"
bokeh = "^3.1.0"
scipy = "^1.11.0"
matplotlib = "^3.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"
black = "^23.12.0"
flake8 = "^6.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 